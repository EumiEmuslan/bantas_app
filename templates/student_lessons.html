<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lessons | Bantas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f3f6fb);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(40,62,95,.12);
    }
    h1 { color: #172033; }
    .lesson-card {
      background: #f8fbff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(40,62,95,.08);
    }
    .lesson-card h2 {
      margin-top: 0;
      color: #356ae6;
    }
  </style>
</head>
<body>
  <div class="container">
  <h1>Mga Aralin</h1>
  <p>Naririto ang inyong mga aralin:</p>

  {% for lesson in lessons %}
    <div class="lesson-card">
      <h2>{{ lesson.title }}</h2>
      <p>{{ lesson.description }}</p>
    </div>
  {% endfor %}
</div>






    <!-- Add more lessons here -->
  </div>
</body>
</html>
