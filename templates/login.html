<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Bantas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f3f6fb);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #fff;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(53,106,230,.15);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #356ae6;
        }
        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 600;
            color: #172033;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6deea;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #356ae6;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background .2s, transform .2s;
        }
        button:hover {
            background: #2858c9;
            transform: translateY(-1px);
        }
        p {
            margin-top: 20px;
            font-size: .95rem;
        }
        a {
            color: #356ae6;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome Back</h1>
        <form action="{{ url_for('login') }}" method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit">Sign In</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
    </div>

    {% with messages = get_flashed_messages() %}
  {% if messages %}
    <script>
      alert("{{ messages[0] }}");
    </script>
  {% endif %}
{% endwith %}

</body>
</html>
