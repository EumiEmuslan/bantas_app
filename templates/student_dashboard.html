<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | Bantas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
/* 📱 Mobile styles */
@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  .top-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    flex-direction: column;
    align-items: stretch;   /* stretch children full width */
    gap: 12px;
  }

  /* Wrap actions in a flex column */
  .card-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .button, .finished {
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 1.4rem;
  }

  p, span {
    font-size: 0.95rem;
  }
}

  </style>
</head>
<body>
  <div class="container">
    <img src="{{ url_for('static', filename='images/dashboard_banner.png') }}" 
     alt="Student Dashboard Banner" 
     style="width:100%; border-radius:12px; margin:16px 0;">
    <p>Pumili ng quiz para simulan:</p>

    <div class="top-actions">
      <a href="{{ url_for('student_lessons') }}" class="button">📘 Mga Aralin</a>
    </div>

   {% for quiz in quizzes %}
  <div class="card">
    <span>{{ quiz['title'] }}</span>
    <div class="card-actions">
      {% if quiz['finished'] %}
        <span class="finished">✔ Finished</span>
      {% else %}
        <a href="{{ url_for('student_quiz', quiz_id=quiz['id']) }}" class="button">▶ Simulan ang Quiz</a>
      {% endif %}
    </div>
  </div>
{% else %}
  <div class="empty">Walang quiz na available.</div>
{% endfor %}


  </div>
</body>
</html>
