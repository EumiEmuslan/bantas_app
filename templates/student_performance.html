<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Performance | Bantas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f3f6fb);
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(40,62,95,.12);
    }
    h1 { margin-top: 0; color: #172033; }
    .average {
      font-size: 1.2em;
      font-weight: 700;
      color: #356ae6;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #e4eaf3;
      text-align: left;
    }
    th {
      background: #f8fbff;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      color: #777;
      font-style: italic;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Performance</h1>

    {% if avg_score is not none %}
      <p class="average">Overall Average Score: {{ "%.2f"|format(avg_score) }}</p>
    {% else %}
      <p class="empty">No scores available yet.</p>
    {% endif %}

    <table>
      <thead>
        <tr>
          <th>Quiz Title</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        {% for r in results %}
        <tr>
          <td>{{ r['title'] }}</td>
          <td>{{ r['score'] }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="2" class="empty">No quizzes taken yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
